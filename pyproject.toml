[project]
name = "colsubsidio30x-minka"
version = "0.1.0"
description = "Local SQLite mirror of the Minka inventory workbook."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2",
  "openpyxl>=3",
  "matcher",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/matcher"]

[tool.uv.sources]
matcher = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["services/matcher/tests", "scripts/tests"]
