[project]
name = "colsubsidio30x-minka"
version = "0.1.0"
description = "Local SQLite mirror of the Minka inventory workbook."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2",
  "openpyxl>=3",
  "matcher",
  "inventory-extractor",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/matcher", "services/product_identification"]

[tool.uv.sources]
matcher = { workspace = true }
inventory-extractor = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2",
    "requests>=2.31",
]
# Opt-in browser E2E stack. Kept out of `dev` so the normal unit-test run never
# downloads Playwright browsers. Install with: uv sync --group e2e
e2e = [
    "pytest>=8",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
# tests/e2e is intentionally NOT listed: it needs the live docker compose
# stack and is run explicitly with `uv run pytest tests/e2e -m e2e`.
testpaths = ["services/matcher/tests", "tests/deployment", "tests/product_identification"]
markers = [
    "e2e: end-to-end smoke tests that require the docker compose stack to be running",
]
