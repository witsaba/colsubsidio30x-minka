[project]
name = "colsubsidio30x-minka"
version = "0.1.0"
description = "Local SQLite mirror of the Minka inventory workbook."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2",
  "openpyxl>=3",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
  "python-multipart>=0.0.9",
  "matcher",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/matcher", "services/product_identification"]

[tool.uv.sources]
matcher = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["services/matcher/tests", "tests/deployment"]
