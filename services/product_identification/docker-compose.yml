services:
  product_identification:
    build:
      context: ../..
      dockerfile: services/product_identification/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - USE_VERTEX_AI=${USE_VERTEX_AI:-true}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-gen-lang-client-0715489298}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-gen-lang-client-0715489298-735dd2d08718.json}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLOUD_API_KEY=${GOOGLE_CLOUD_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
