[project]
name = "stt-service"
version = "0.1.0"
description = "Module 1 — speech-to-text service (Deepgram primary, Groq fallback)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  # Pinned: Decision 6 couples the upload cap to Starlette's 1 MiB
  # max_part_size / SpooledTemporaryFile spool threshold. Bumping this
  # range requires re-checking that coupling.
  "starlette>=0.41,<0.48",
]

[dependency-groups]
dev = [
  "openpyxl>=3.1.5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
