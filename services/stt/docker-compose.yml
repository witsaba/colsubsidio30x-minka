services:
  stt:
    build: .
    ports:
      - "8001:8001"
    environment:
      # Neither key is required here: only the ACTIVE vendor's key is, and the
      # boot validator in src/settings.py already fails fast with a message
      # naming the missing variable (REQ-VND-5). Demanding both at the compose
      # layer only blocked Groq-only deployments (JD-4).
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      STT_VENDOR: ${STT_VENDOR:-deepgram}
      STT_ELEVENLABS_MODEL: ${STT_ELEVENLABS_MODEL:-scribe_v1}
      STT_LANGUAGE: es
      STT_MODEL: nova-3
      STT_NUMERALS: "true"
      STT_MIP_OPT_OUT: "true"
      STT_CONFIDENCE_FLOOR: "0.60"
      STT_MIN_SPEECH_MS: ${STT_MIN_SPEECH_MS:-300}
      STT_MAX_UPLOAD_BYTES: ${STT_MAX_UPLOAD_BYTES:-1048576}
      STT_VENDOR_TIMEOUT_S: ${STT_VENDOR_TIMEOUT_S:-30}
      STT_RETRY_ATTEMPTS: ${STT_RETRY_ATTEMPTS:-2}
      STT_RETRY_BACKOFF_S: ${STT_RETRY_BACKOFF_S:-0.5}
      STT_FALLBACK_ENABLED: ${STT_FALLBACK_ENABLED:-true}
      # Empty means auto-select by priority; a blank reads as unset.
      STT_FALLBACK_VENDOR: ${STT_FALLBACK_VENDOR:-}
      STT_TOTAL_DEADLINE_S: ${STT_TOTAL_DEADLINE_S:-45}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Failures during startup do not count against `retries`, so a slow boot
      # is not mistaken for an unhealthy service (GOAL-3).
      start_period: 15s
    restart: unless-stopped
